# Release workflow — Changesets-based SemVer releases.
#
# Flow:
#   1. Devs add `.changeset/*.md` files via `pnpm changeset` as part of PRs.
#   2. Maintainers run this workflow manually after release permissions are configured.
#   3. If unprocessed changesets exist, the action opens a "Version Packages" PR
#      aggregating them; that PR bumps versions + writes CHANGELOGs via
#      `pnpm version-packages` (= `changeset version`).
#   4. When the Version Packages PR merges, this workflow re-runs and the action
#      invokes `pnpm changeset publish` to publish to npm + create git tags +
#      draft GitHub Releases.
#
# Secrets required (configure in repo Settings → Secrets and variables → Actions):
#   - NPM_TOKEN: npm automation token with publish rights for @armyofagents/* packages.
#     Create at https://www.npmjs.com/settings/<user>/tokens (type: Automation).
#   - GITHUB_TOKEN: automatic, provided by Actions. No manual setup required.
#
# Note: `scripts/release.sh` remains the local-release escape hatch for one-shot
# patch/minor/major bumps outside this Changesets flow. It is NOT invoked from CI.

name: Release

on:
  # Automatic release PR creation requires repository Actions settings:
  # Settings -> Actions -> General -> Workflow permissions -> Read and write permissions
  # and Allow GitHub Actions to create and approve pull requests. Until that
  # repository setting is enabled, keep release creation manual so normal pushes
  # do not fail on the Changesets PR creation step.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  post-publish-smoke:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/release-smoke.yml
    with:
      aoa_version: latest
      host_port: "3232"
      artifact_name: release-smoke-post-publish
    secrets: inherit
