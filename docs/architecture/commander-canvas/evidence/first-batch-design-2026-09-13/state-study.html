<script>
const $=s=>document.querySelector(s), w=$('.workspace'), body=$('.body');
const states={loading:'<h2>Loading task conversation…</h2><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>',failure:'<h2>This view couldn’t load</h2><p>Your task may still be running. Reloading this view does not restart it.</p><button class="retry">Retry view</button><a href="#">Open task</a>',revoked:'<h2>You no longer have access</h2><p>This view and its preview no longer show the task’s content.</p><button class="retry">Close view</button>',deleted:'<h2>No longer available</h2><p>This reference is no longer available. Your other work remains open.</p><button class="retry">Close view</button>',focus:'<h2>Launch story</h2><p>The selected header is softly tinted. Keyboard focus identifies the specific control.</p><p>Shared frame controls stay in the header; message content scrolls within the panel.</p>',attention:'<h2>Launch story</h2><p>One foreground panel fits this space. Other open panels remain recoverable through the tray.</p><p>A longer question opens its task conversation, preserving the active composer.</p>',empty:'',initial:''};
