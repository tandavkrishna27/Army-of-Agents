<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AoA" />
    <title>AoA</title>
    <style>
      /* A route-aware pre-React safety net. If the application bundle or a
         provider fails before React mounts, onboarding remains dark and shows
         a useful recovery message instead of the browser's white canvas. */
      html[data-aoa-onboarding-boot="dark"],
      html[data-aoa-onboarding-boot="dark"] body,
      html[data-aoa-onboarding-boot="dark"] #root {
        min-height: 100%;
        margin: 0;
        background: #0a0a0a;
        color: #eeeeee;
        color-scheme: dark;
      }
      #aoa-boot-fallback {
        box-sizing: border-box;
        display: none;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #eeeeee;
        font: 14px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      html[data-aoa-onboarding-boot="dark"] #aoa-boot-fallback {
        display: grid;
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        if (window.location.pathname.startsWith("/onboarding")) {
          document.documentElement.dataset.aoaOnboardingBoot = "dark";
        }
        // Inline FOUC-prevention. Reads aoa.theme first, falls back to the
        // legacy paperclip.theme key for users who haven't yet hit the
        // boot-time migration in src/lib/storage-migrations.ts. This dual
        // read keeps the user's chosen theme stable across the rebrand
        // even on the first reload, before main.tsx runs.
        const newKey = "aoa.theme";
        const legacyKey = "paperclip.theme";
        const darkThemeColor = "#18181b";
        const lightThemeColor = "#ffffff";
        try {
          const stored =
            window.localStorage.getItem(newKey) ??
            window.localStorage.getItem(legacyKey);
          const theme = stored === "light" || stored === "dark" ? stored : "dark";
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="aoa-boot-fallback" role="status">
        <div>
          <strong>Loading AOA onboarding…</strong>
          <div>If this message remains, reload the page. Your setup progress is saved.</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
